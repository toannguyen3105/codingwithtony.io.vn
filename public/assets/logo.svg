<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BBDB1"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.8; stroke-width: 14; }
        50% { opacity: 1; stroke-width: 20; }
      }
      @keyframes draw {
        0% { stroke-dasharray: 0 200; stroke-dashoffset: 0; }
        100% { stroke-dasharray: 200 0; stroke-dashoffset: 0; }
      }
      .bracket {
        animation: float 3s ease-in-out infinite;
        transform-origin: center;
      }
      .bracket-left {
        animation-delay: 0s;
      }
      .bracket-right {
        animation-delay: 1.5s;
      }
      .letter-t {
        animation: pulse 4s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-path {
        animation: draw 2s ease-out forwards;
      }
    </style>
  </defs>
  
  <rect width="256" height="256" rx="64" fill="url(#logo-grad)"/>
  
  <!-- < -->
  <g class="bracket bracket-left">
    <path class="animated-path" d="M 76 96 L 44 128 L 76 160" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- > -->
  <g class="bracket bracket-right">
    <path class="animated-path" d="M 180 96 L 212 128 L 180 160" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- T -->
  <g class="letter-t">
    <path class="animated-path" d="M 104 96 L 152 96 M 128 96 L 128 160" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
